name: web-ci

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/**"
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install (web)
        working-directory: web
        run: npm install

      - name: Test
        working-directory: web
        run: npm run test:run
