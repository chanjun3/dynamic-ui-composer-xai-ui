name: web-ci

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install (web)
        run: pnpm --dir web install --frozen-lockfile

      - name: Typecheck (if exists)
        run: |
          if pnpm --dir web -s run | grep -qE '^typecheck'; then pnpm --dir web typecheck; else echo "skip: no typecheck script"; fi

      - name: Lint (if exists)
        run: |
          if pnpm --dir web -s run | grep -qE '^lint'; then pnpm --dir web lint; else echo "skip: no lint script"; fi

      - name: Test
        run: pnpm --dir web test:run
