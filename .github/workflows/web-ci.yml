name: web-ci

on:
  push:
    paths:
      - "web/**"
  pull_request:
    paths:
      - "web/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (if exists)
        run: |
          if pnpm -s run | grep -qE '^typecheck'; then pnpm typecheck; else echo "skip: no typecheck script"; fi

      - name: Lint (if exists)
        run: |
          if pnpm -s run | grep -qE '^lint'; then pnpm lint; else echo "skip: no lint script"; fi

      - name: Test
        run: pnpm test:run
